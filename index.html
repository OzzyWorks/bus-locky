<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="description" content="あすか交通・稲毛線の次のバスをカウントダウン表示"><link rel="manifest" href="./manifest.webmanifest"><title>Bus.Locky｜あすか交通</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#151f30;--muted:#91a0b5;--line:#26344a;--accent:#66d9c2;--text:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#14233a 0,#0b1220 48%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh}main{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 16px}h1{font-size:21px;margin:0}header small{color:var(--muted)}.segment{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#0b1423;padding:6px;border-radius:15px;margin:8px 0 14px}button{font:inherit;cursor:pointer}.route{border:0;border-radius:11px;background:transparent;color:#9eacc0;padding:13px 8px;font-size:14px;font-weight:700}.route.active{background:#26384f;color:#fff;box-shadow:0 2px 10px #0004}.card{background:linear-gradient(145deg,#1a2a40,#121c2b);border:1px solid #30435d;border-radius:22px;padding:22px 18px;margin:12px 0;box-shadow:0 12px 35px #0003}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.08em}.destination{font-size:19px;font-weight:750;margin:7px 0 18px}.countlabel{text-align:center;color:#a8b8cc;font-size:13px}.count{font-variant-numeric:tabular-nums;text-align:center;font-size:clamp(58px,16vw,84px);line-height:1.1;font-weight:800;letter-spacing:-.055em;margin:4px 0;color:var(--accent)}.depart{text-align:center;font-size:19px;font-weight:700;margin:10px 0 0}.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:7px}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin:16px 2px 4px}.nextlist{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.nextlist h2{font-size:15px;margin:0 0 10px}.item{display:flex;justify-content:space-between;padding:12px 2px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}.item b{font-size:17px}.item small{color:var(--muted)}.actions{display:flex;gap:9px}.action{flex:1;background:#1a2a40;color:#dce8f5;border:1px solid #354b67;border-radius:12px;padding:12px;font-weight:650}.status{font-size:12px;color:var(--muted);text-align:center;line-height:1.7;margin:16px 4px}.status a{color:var(--accent)}.notice{padding:13px;border-radius:12px;background:#382d1b;color:#ffdda3;font-size:13px;line-height:1.6;margin-top:12px}@media(min-width:520px){main{padding-top:18px}}
</style></head><body><main>
<header><div><h1>🚌 Bus.Locky</h1><small>あすか交通・稲毛線</small></div><small id="clock">--:--:--</small></header>
<div class="segment" role="group" aria-label="経路選択"><button class="route active" data-route="inage">① 稲毛駅発<br>幸町団地循環</button><button class="route" data-route="rotary">② 幸町ロータリー発<br>稲毛駅行き</button></div>
<section class="card"><div class="eyebrow" id="routeName">① 稲毛駅 → 幸町団地循環</div><div class="destination" id="direction">次のバス</div><div class="countlabel">発車まで</div><div class="count" id="count">--:--</div><div class="depart" id="departure">時刻表を読み込み中</div><div class="hint" id="remaining">現在時刻を確認しています</div></section>
<div class="meta"><span id="serviceDay">-- ダイヤ</span><span id="today">----</span></div><section class="nextlist"><h2>このあとの発車</h2><div id="upcoming"><div class="item"><small>時刻表を読み込んでいます</small></div></div></section>
<div class="actions"><button class="action" id="refresh">↻ 時刻表を更新</button><button class="action" id="switch">経路を切替</button></div>
<div class="status" id="status">時刻表データを確認しています…</div><div class="notice" id="notice" hidden>時刻表データがまだ登録されていません。公式時刻表の自動取得が完了するまでお待ちください。</div></main>
<script>
const ROUTES={inage:{label:"① 稲毛駅 → 幸町団地循環",direction:"幸町団地循環",key:"inage_to_saiwai"},rotary:{label:"② 幸町中央ロータリー → 稲毛駅",direction:"JR稲毛駅行き",key:"rotary_to_inage"}};
let data=null,route="inage";const $=id=>document.getElementById(id);
function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function jpHolidays(year){
 const set=new Set(),add=(m,d)=>set.add(dateKey(new Date(year,m-1,d))),nth=(m,n,w)=>{const first=new Date(year,m-1,1).getDay();return 1+((w-first+7)%7)+(n-1)*7};
 [ [1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23] ].forEach(x=>add(x[0],x[1]));
 add(1,nth(1,2,1));add(7,nth(7,3,1));add(9,nth(9,3,1));add(10,nth(10,2,1));
 const y=year-1980;add(3,Math.floor(20.8431+.242194*y-Math.floor(y/4)));add(9,Math.floor(23.2488+.242194*y-Math.floor(y/4)));
 if(year===2020){set.delete(dateKey(new Date(year,6,20)));add(7,23);add(8,10)}
 if(year===2021){set.delete(dateKey(new Date(year,6,19)));add(7,22);add(8,8)}
 const base=[...set].map(s=>new Date(s+"T12:00:00"));
 base.forEach(d=>{if(d.getDay()===0){let x=new Date(d);do{x.setDate(x.getDate()+1)}while(set.has(dateKey(x)));set.add(dateKey(x))}});
 for(let m=1;m<=12;m++)for(let day=2;day<31;day++){const d=new Date(year,m-1,day);if(d.getMonth()!==m-1)continue;const prev=new Date(d);prev.setDate(day-1);const next=new Date(d);next.setDate(day+1);if(set.has(dateKey(prev))&&set.has(dateKey(next))&&d.getDay()!==0)set.add(dateKey(d))}
 return set
}
function serviceType(d){const day=d.getDay();return day===0||day===6||jpHolidays(d.getFullYear()).has(dateKey(d))?"holiday":"weekday"}
function fmtDate(d){return new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(d)}
function parseTimes(date){const entry=data&&data.routes&&data.routes[ROUTES[route].key];if(!entry)return [];const type=serviceType(date);return (entry[type]||[]).map(t=>{const a=t.split(":").map(Number);return {h:a[0],m:a[1],label:t}}).sort((a,b)=>a.h*60+a.m-b.h*60-b.m)}
function nextDepartures(now){const mins=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;let out=[];for(let offset=0;offset<=2;offset++){const day=new Date(now);day.setDate(day.getDate()+offset);for(const t of parseTimes(day)){const total=t.h*60+t.m+offset*1440;if(total>mins+0.01){const d=new Date(now);d.setDate(d.getDate()+offset);d.setHours(t.h,t.m,0,0);out.push({time:t.label,date:d,minutes:Math.floor(total-mins)})}}if(out.length>=5)break}return out.slice(0,5)}
function render(){const now=new Date();$("clock").textContent=now.toLocaleTimeString("ja-JP");$("today").textContent=fmtDate(now);$("serviceDay").textContent=serviceType(now)==="weekday"?"平日ダイヤ":"土曜・休日ダイヤ";$("routeName").textContent=ROUTES[route].label;$("direction").textContent=ROUTES[route].direction;const list=nextDepartures(now),entry=data&&data.routes&&data.routes[ROUTES[route].key];$("notice").hidden=!!(entry&&((entry.weekday&&entry.weekday.length)||(entry.holiday&&entry.holiday.length)));
if(!list.length){$("count").textContent="--:--";$("departure").textContent="本日の運行は終了しました";$("remaining").textContent="";$("upcoming").innerHTML='<div class="item"><small>次の運行日をご確認ください</small></div>';return}
const n=list[0],s=n.minutes,hh=Math.floor(s/60),mm=s%60,ss=59-now.getSeconds();$("count").textContent=hh?String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0"):String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");$("departure").textContent=n.time+" 発";$("remaining").textContent=hh?"あと "+hh+"時間 "+mm+"分":"あと "+s+"分";$("upcoming").innerHTML=list.map((x,i)=>'<div class="item"><b>'+x.time+'</b><small>'+(i===0?"次発":"あと "+x.minutes+"分")+(x.date.getDate()!==now.getDate()?"（翌日）":"")+'</small></div>').join("")}
async function load(force){$("status").textContent="時刻表データを確認しています…";try{const res=await fetch("./data/timetable.json"+(force?"?t="+Date.now():""),{cache:force?"no-store":"default"});if(!res.ok)throw Error("HTTP "+res.status);data=await res.json();$("status").textContent="時刻表更新日："+(data.updatedAt||"未確認")+" ／ アプリ内データを15分ごとに再読込";}catch(e){$("status").textContent="時刻表データを取得できません。通信状態を確認してください。"}render()}
function setRoute(v){route=v;document.querySelectorAll(".route").forEach(b=>b.classList.toggle("active",b.dataset.route===v));render()}
document.querySelectorAll(".route").forEach(b=>b.addEventListener("click",()=>setRoute(b.dataset.route)));$("switch").onclick=()=>setRoute(route==="inage"?"rotary":"inage");$("refresh").onclick=()=>load(true);load(false);setInterval(render,1000);setInterval(()=>load(false),15*60*1000);
</script></body></html>
